name: n8n-local

services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.41.3}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_HOST_PORT:-5678}
      WEBHOOK_URL: http://localhost:${N8N_HOST_PORT:-5678}
      N8N_SECURE_COOKIE: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Lancez le script de démarrage pour générer le fichier .env}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Europe/Paris}
      TZ: ${GENERIC_TIMEZONE:-Europe/Paris}
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:5678/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  init-owner:
    image: n8nio/n8n:${N8N_VERSION:-2.41.3}
    profiles: ["setup"]
    restart: "no"
    entrypoint: ["node"]
    command: ["/opt/n8n-bootstrap/init-owner.mjs"]
    environment:
      N8N_INTERNAL_URL: http://n8n:5678
      N8N_OWNER_EMAIL: ${N8N_OWNER_EMAIL:-admin@local.test}
      N8N_OWNER_FIRST_NAME: ${N8N_OWNER_FIRST_NAME:-Admin}
      N8N_OWNER_LAST_NAME: ${N8N_OWNER_LAST_NAME:-Local}
      N8N_OWNER_PASSWORD: ${N8N_OWNER_PASSWORD:-Admin123}
    volumes:
      - ./scripts/init-owner.mjs:/opt/n8n-bootstrap/init-owner.mjs:ro
    depends_on:
      n8n:
        condition: service_healthy

volumes:
  n8n_data:
    name: n8n-local-data
